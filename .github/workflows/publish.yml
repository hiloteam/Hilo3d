name: Publish npm package

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate tag and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up validation Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Set up repository npm
        run: |
          corepack enable npm
          corepack install
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify tag matches all package versions and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node --print "require('./package.json').version")
          if [ "$RELEASE_TAG" != "$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version."
            exit 1
          fi
          npm run release:versions:check
          npm run release:tag:verify

      - name: Run portable release validation
        run: npm run validate:ci
        env:
          CI: 'true'

      - name: Set up trusted-publishing Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Set up trusted-publishing npm
        run: |
          npm install --global npm@11.19.1
          npm --version

      - name: Publish all packages with the matching dist-tag
        run: |
          version=$(node --print "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            dist_tag=next
          else
            dist_tag=latest
          fi

          publish_package() {
            package_path="$1"
            package_name=$(node --print "require('./${package_path}/package.json').name")
            if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
              echo "${package_name}@${version} is already published; skipping."
              return
            fi
            npm publish "$package_path" --tag "$dist_tag" --access public
          }

          publish_package .
          publish_package addon-particle
          publish_package addon-physics
