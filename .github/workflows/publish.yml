name: Publish npm package

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate tag and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up validation Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Set up repository npm
        run: |
          corepack enable npm
          corepack install
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify tag matches package version and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version=$(node --print "require('./package.json').version")
          if [ "$RELEASE_TAG" != "$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version."
            exit 1
          fi
          npm run release:tag:verify

      - name: Run portable release validation
        run: npm run validate:ci
        env:
          CI: 'true'

      - name: Set up trusted-publishing Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Set up trusted-publishing npm
        run: |
          npm install --global npm@11.19.1
          npm --version

      - name: Publish package with the matching dist-tag
        run: |
          version=$(node --print "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            dist_tag=next
          else
            dist_tag=latest
          fi
          npm publish --tag "$dist_tag" --access public
