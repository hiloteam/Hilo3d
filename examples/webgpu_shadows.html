<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Shadow Mapping Example - Hilo3d</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">
        <h3>WebGPU Shadow Mapping</h3>
        <p>Directional light shadows with PCF filtering</p>
        <p>Light rotates around the scene</p>
    </div>

    <script src="../build/Hilo3d.js"></script>
    <script>
        async function init() {
            const canvas = document.getElementById('canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Check WebGPU support
            const supported = await Hilo3d.WebGPUSupport.get();
            if (!supported) {
                document.getElementById('info').innerHTML = '<h3>WebGPU Not Supported</h3><p>Please use Chrome 113+ or another WebGPU-enabled browser</p>';
                return;
            }

            // Initialize WebGPU renderer with shadows enabled
            const renderer = new Hilo3d.WebGPURenderer({
                canvas: canvas,
                width: canvas.width,
                height: canvas.height,
                clearColor: new Hilo3d.Color(0.1, 0.1, 0.15, 1),
                enableShadows: true
            });

            await renderer.initContext();

            // Create stage
            const stage = new Hilo3d.Node();

            // Create camera
            const camera = new Hilo3d.PerspectiveCamera({
                aspect: canvas.width / canvas.height,
                fov: 60,
                near: 0.1,
                far: 100
            });
            camera.z = 8;
            camera.y = 5;
            camera.lookAt(new Hilo3d.Vector3(0, 0, 0));

            // Create ground plane
            const groundGeometry = new Hilo3d.PlaneGeometry({
                width: 20,
                height: 20
            });
            const groundMaterial = new Hilo3d.BasicMaterial({
                diffuse: new Hilo3d.Color(0.3, 0.3, 0.35)
            });
            const ground = new Hilo3d.Mesh({
                geometry: groundGeometry,
                material: groundMaterial
            });
            ground.rotationX = -90;
            stage.addChild(ground);

            // Create boxes
            const box1Geometry = new Hilo3d.BoxGeometry();
            const box1Material = new Hilo3d.BasicMaterial({
                diffuse: new Hilo3d.Color(0.8, 0.3, 0.3)
            });
            const box1 = new Hilo3d.Mesh({
                geometry: box1Geometry,
                material: box1Material
            });
            box1.y = 1;
            box1.x = -2;
            stage.addChild(box1);

            const box2 = new Hilo3d.Mesh({
                geometry: new Hilo3d.BoxGeometry(),
                material: new Hilo3d.BasicMaterial({
                    diffuse: new Hilo3d.Color(0.3, 0.8, 0.3)
                })
            });
            box2.y = 1;
            box2.x = 2;
            stage.addChild(box2);

            const sphere = new Hilo3d.Mesh({
                geometry: new Hilo3d.SphereGeometry(),
                material: new Hilo3d.BasicMaterial({
                    diffuse: new Hilo3d.Color(0.3, 0.3, 0.8)
                })
            });
            sphere.y = 1.5;
            stage.addChild(sphere);

            // Animation loop
            let angle = 0;
            function animate() {
                angle += 0.01;

                // Rotate light around scene
                const lightX = Math.cos(angle) * 5;
                const lightZ = Math.sin(angle) * 5;
                renderer.setLightDirection(new Hilo3d.Vector3(-lightX, -5, -lightZ).normalize());

                // Rotate objects
                box1.rotationY += 0.5;
                box2.rotationY -= 0.5;
                sphere.rotationX += 0.3;

                // Render
                renderer.render(stage, camera);

                requestAnimationFrame(animate);
            }

            animate();

            // Handle window resize
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                camera.aspect = canvas.width / canvas.height;
                renderer.resize(canvas.width, canvas.height);
            });
        }

        init().catch(error => {
            console.error('WebGPU Shadow Example Error:', error);
            document.getElementById('info').innerHTML = `<h3>Error</h3><p>${error.message}</p>`;
        });
    </script>
</body>
</html>
