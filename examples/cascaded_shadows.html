<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
        />
        <title>Hilo3D — Four Courts of Light</title>
        <link rel="stylesheet" type="text/css" href="./example.css" />
        <link rel="stylesheet" type="text/css" href="./cascaded_shadows.css" />
    </head>
    <body>
        <div id="container"></div>

        <header class="titleCard">
            <p>Hilo3D · Cascaded shadow maps</p>
            <h1>Four courts<br />of light.</h1>
            <span>200 metres of sunset, held in one frame.</span>
        </header>

        <aside class="depthReadout" aria-label="Cascade distance readout">
            <div class="depthHeading">
                <span>View depth</span>
                <strong id="modeSummary">4 × 2048²</strong>
            </div>
            <div id="splitTrack" class="depthTrack">
                <i class="depthNear"></i>
                <i class="depthMiddle"></i>
                <i class="depthDeep"></i>
                <i class="depthFar"></i>
            </div>
            <div id="splitValues" class="depthValues"></div>
        </aside>

        <section class="controlDock" aria-label="Cascaded shadow controls">
            <div class="backendPill">
                <span class="statusLight"></span>
                <span id="backendBadge">initializing</span>
            </div>

            <fieldset class="modeGroup">
                <legend>Shadow layers</legend>
                <button data-cascade-count="0" aria-pressed="false">Off</button>
                <button data-cascade-count="1" aria-pressed="false">1</button>
                <button data-cascade-count="2" aria-pressed="false">2</button>
                <button data-cascade-count="4" aria-pressed="true">4</button>
            </fieldset>

            <button id="stabilizeToggle" class="stabilizeButton" aria-pressed="true">
                <span class="toggleGlyph" aria-hidden="true"><i></i></span>
                <span><strong>Stable</strong><small>texel lock</small></span>
            </button>

            <details class="tuningPanel">
                <summary>Fine tune</summary>
                <div class="tuningGrid">
                    <label>
                        <span>Split <output id="lambdaOutput">0.35</output></span>
                        <input
                            id="lambdaControl"
                            type="range"
                            min="0"
                            max="1"
                            step="0.05"
                            value="0.35"
                        />
                    </label>
                    <label>
                        <span>Blend <output id="blendOutput">10%</output></span>
                        <input
                            id="blendControl"
                            type="range"
                            min="0"
                            max="0.3"
                            step="0.02"
                            value="0.1"
                        />
                    </label>
                    <label>
                        <span>Contrast <output id="strengthOutput">3.00</output></span>
                        <input
                            id="strengthControl"
                            type="range"
                            min="0.5"
                            max="4"
                            step="0.05"
                            value="3"
                        />
                    </label>
                    <label>
                        <span>Reach <output id="distanceOutput">200 m</output></span>
                        <input
                            id="distanceControl"
                            type="range"
                            min="80"
                            max="260"
                            step="10"
                            value="200"
                        />
                    </label>
                </div>
            </details>
        </section>

        <p class="interactionHint">Drag to orbit · Wheel to zoom · O toggles shadows</p>
        <script type="module" src="./cascaded_shadows.ts"></script>
    </body>
</html>
