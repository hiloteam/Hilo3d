<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
        <meta
            name="description"
            content="A cinematic WebGPU compute installation rendered through Hilo3D."
        />
        <title>Hilo3D — Eclipse Shrine</title>
        <script>
            if (new URLSearchParams(window.location.search).get('test') === '1') {
                document.documentElement.classList.add('test-mode');
            }
        </script>
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    Inter, 'SF Pro Display', 'Helvetica Neue', ui-sans-serif, system-ui, sans-serif;
                background: #010207;
                color: #f3efe8;
                --warm: #f5b96d;
                --cool: #86e8ff;
                --line: rgb(220 234 255 / 18%);
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: radial-gradient(
                    circle at 50% 38%,
                    #11182b 0%,
                    #03050d 50%,
                    #010207 100%
                );
            }

            body {
                user-select: none;
                -webkit-font-smoothing: antialiased;
                text-rendering: geometricPrecision;
            }

            #container,
            #container canvas {
                position: fixed;
                inset: 0;
                width: 100% !important;
                height: 100% !important;
            }

            #container canvas {
                cursor: crosshair;
                touch-action: none;
            }

            #frame {
                position: fixed;
                inset: 18px;
                z-index: 4;
                border: 1px solid rgb(216 232 255 / 13%);
                pointer-events: none;
                opacity: 0.92;
            }

            #frame::before,
            #frame::after {
                position: absolute;
                width: 58px;
                height: 58px;
                content: '';
                border-color: rgb(245 185 109 / 56%);
            }

            #frame::before {
                top: -1px;
                left: -1px;
                border-top: 1px solid;
                border-left: 1px solid;
            }

            #frame::after {
                right: -1px;
                bottom: -1px;
                border-right: 1px solid;
                border-bottom: 1px solid;
            }

            #grain,
            #vignette {
                position: fixed;
                inset: 0;
                z-index: 3;
                pointer-events: none;
            }

            #grain {
                opacity: 0.055;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.68'/%3E%3C/svg%3E");
                mix-blend-mode: soft-light;
            }

            #vignette {
                background:
                    linear-gradient(
                        90deg,
                        rgb(1 2 7 / 62%),
                        transparent 24%,
                        transparent 77%,
                        rgb(1 2 7 / 48%)
                    ),
                    linear-gradient(
                        0deg,
                        rgb(1 2 7 / 72%),
                        transparent 25%,
                        transparent 72%,
                        rgb(1 2 7 / 32%)
                    );
            }

            #hud {
                position: fixed;
                inset: 0;
                z-index: 5;
                isolation: isolate;
                display: grid;
                grid-template-rows: auto 1fr auto;
                padding: 42px 48px 38px;
                pointer-events: none;
                text-transform: uppercase;
                letter-spacing: 0.14em;
                transform: translateZ(0);
                backface-visibility: hidden;
            }

            .masthead {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 32px;
            }

            .identity {
                display: flex;
                align-items: flex-start;
                gap: 17px;
            }

            .index {
                color: var(--warm);
                font-family: 'SFMono-Regular', Consolas, monospace;
                font-size: 10px;
                letter-spacing: 0.08em;
                line-height: 1.4;
            }

            .title {
                display: grid;
                gap: 3px;
            }

            .title strong {
                font-size: clamp(19px, 2.25vw, 35px);
                font-weight: 520;
                line-height: 0.94;
                letter-spacing: 0.34em;
                text-shadow: 0 0 32px rgb(245 185 109 / 18%);
            }

            .title small {
                color: rgb(208 222 239 / 48%);
                font-size: 8px;
                letter-spacing: 0.37em;
            }

            .telemetry {
                display: grid;
                grid-template-columns: repeat(3, auto);
                gap: 22px;
                color: rgb(209 226 243 / 48%);
                font-family: 'SFMono-Regular', Consolas, monospace;
                font-size: 8px;
                line-height: 1.8;
                text-align: right;
            }

            .telemetry b {
                display: block;
                color: rgb(237 245 255 / 88%);
                font-size: 9px;
                font-weight: 500;
            }

            .center-mark {
                place-self: center;
                width: 54px;
                height: 54px;
                border: 1px solid rgb(235 241 255 / 14%);
                border-radius: 50%;
                opacity: 0.55;
                transform: translateY(2px);
            }

            .center-mark::before,
            .center-mark::after {
                position: absolute;
                top: 50%;
                left: 50%;
                content: '';
                background: rgb(235 241 255 / 28%);
                transform: translate(-50%, -50%);
            }

            .center-mark::before {
                width: 76px;
                height: 1px;
            }

            .center-mark::after {
                width: 1px;
                height: 76px;
            }

            .footer {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                gap: 28px;
            }

            .controls {
                display: grid;
                gap: 10px;
            }

            .hint {
                display: flex;
                gap: 18px;
                color: rgb(206 222 239 / 48%);
                font-size: 8px;
            }

            .hint b {
                color: rgb(240 245 250 / 82%);
                font-weight: 520;
            }

            .palettes {
                display: flex;
                gap: 6px;
                pointer-events: auto;
            }

            .palette {
                position: relative;
                min-width: 86px;
                padding: 8px 11px 8px 25px;
                border: 1px solid rgb(213 230 248 / 13%);
                background: rgb(4 7 15 / 38%);
                color: rgb(202 219 236 / 48%);
                font:
                    8px/1 'SFMono-Regular',
                    Consolas,
                    monospace;
                letter-spacing: 0.13em;
                text-align: left;
                text-transform: uppercase;
                cursor: pointer;
                backdrop-filter: blur(12px);
                transition:
                    border-color 180ms ease,
                    color 180ms ease,
                    background 180ms ease;
            }

            .palette::before {
                position: absolute;
                top: 50%;
                left: 10px;
                width: 6px;
                height: 6px;
                content: '';
                border-radius: 50%;
                background: var(--swatch);
                box-shadow: 0 0 10px var(--swatch);
                transform: translateY(-50%);
            }

            .palette:hover,
            .palette[aria-pressed='true'] {
                border-color: color-mix(in srgb, var(--swatch), transparent 38%);
                background: rgb(12 17 30 / 58%);
                color: #f4f7fb;
            }

            .status {
                display: flex;
                align-items: center;
                gap: 10px;
                color: rgb(199 217 235 / 42%);
                font:
                    8px/1.6 'SFMono-Regular',
                    Consolas,
                    monospace;
                text-align: right;
            }

            .status-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #9fffd8;
                box-shadow: 0 0 12px #74ffd1;
            }

            #loading,
            #failure {
                position: fixed;
                inset: 0;
                z-index: 20;
                display: grid;
                place-items: center;
                background: #010207;
                transition:
                    opacity 720ms ease,
                    visibility 720ms ease;
            }

            #loading[hidden],
            #failure[hidden] {
                display: grid;
                visibility: hidden;
                opacity: 0;
            }

            .loader {
                display: grid;
                justify-items: center;
                gap: 16px;
                color: rgb(220 230 242 / 54%);
                font:
                    8px/1 'SFMono-Regular',
                    Consolas,
                    monospace;
                letter-spacing: 0.28em;
                text-transform: uppercase;
            }

            .loader-ring {
                width: 54px;
                height: 54px;
                border: 1px solid rgb(131 232 255 / 16%);
                border-top-color: var(--warm);
                border-radius: 50%;
                animation: spin 1.4s linear infinite;
            }

            #failure {
                padding: 32px;
                color: #dce7f3;
                text-align: center;
            }

            #failure div {
                max-width: 520px;
            }

            #failure strong {
                display: block;
                margin-bottom: 12px;
                color: var(--warm);
                font-size: 15px;
                font-weight: 500;
                letter-spacing: 0.18em;
                text-transform: uppercase;
            }

            #failure p {
                color: rgb(220 231 243 / 58%);
                font-size: 12px;
                line-height: 1.7;
            }

            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            @media (max-width: 760px) {
                #frame {
                    inset: 10px;
                }

                #hud {
                    padding: 25px 22px 22px;
                }

                .telemetry > :not(:first-child),
                .status span:last-child,
                .center-mark,
                .hint span:nth-child(3) {
                    display: none;
                }

                .title strong {
                    letter-spacing: 0.2em;
                }

                .footer {
                    align-items: flex-end;
                }

                .hint {
                    display: grid;
                    gap: 5px;
                }

                .palette {
                    min-width: 0;
                    width: 34px;
                    height: 30px;
                    padding: 0;
                    overflow: hidden;
                    color: transparent;
                }

                .palette:hover,
                .palette[aria-pressed='true'] {
                    color: transparent;
                }

                .palette::before {
                    left: 50%;
                    transform: translate(-50%, -50%);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .loader-ring {
                    animation-duration: 4s;
                }
            }

            html.test-mode #grain,
            html.test-mode #vignette,
            html.test-mode #frame,
            html.test-mode #hud {
                display: none;
            }

            html.test-mode .loader-ring {
                animation: none;
            }
        </style>
    </head>
    <body>
        <div id="container"></div>
        <div id="grain"></div>
        <div id="vignette"></div>
        <div id="frame"></div>
        <main id="hud" aria-label="Eclipse Shrine controls and renderer status">
            <header class="masthead">
                <div class="identity">
                    <span class="index">07<br />∞</span>
                    <div class="title">
                        <strong>Eclipse Shrine</strong>
                        <small>Realtime gravitational reliquary</small>
                    </div>
                </div>
                <div class="telemetry" aria-label="Renderer telemetry">
                    <span><b>65,536</b>GPU bodies</span>
                    <span><b>03</b>Indirect layers</span>
                    <span><b>HDR</b>Render graph</span>
                </div>
            </header>
            <div class="center-mark" aria-hidden="true"></div>
            <footer class="footer">
                <div class="controls">
                    <div class="hint">
                        <span><b>Drag</b> orbit shrine</span>
                        <span><b>Hold</b> gravity pulse</span>
                        <span><b>Wheel</b> dolly</span>
                    </div>
                    <div class="palettes" aria-label="Spectral palette">
                        <button
                            class="palette"
                            style="--swatch: #f4bb73"
                            data-palette="0"
                            aria-pressed="true"
                        >
                            Aurelia
                        </button>
                        <button
                            class="palette"
                            style="--swatch: #a888ff"
                            data-palette="1"
                            aria-pressed="false"
                        >
                            Noctis
                        </button>
                        <button
                            class="palette"
                            style="--swatch: #86eaff"
                            data-palette="2"
                            aria-pressed="false"
                        >
                            Vesper
                        </button>
                    </div>
                </div>
                <div class="status">
                    <i class="status-dot"></i>
                    <span>WebGPU compute online</span>
                    <span>Hilo3D / portable RHI</span>
                </div>
            </footer>
        </main>
        <div id="loading">
            <div class="loader">
                <span class="loader-ring"></span>
                <span>Converging particle field</span>
            </div>
        </div>
        <div id="failure" hidden>
            <div>
                <strong>WebGPU ritual unavailable</strong>
                <p></p>
            </div>
        </div>
        <script type="module" src="./compute_eclipse_shrine.ts"></script>
    </body>
</html>
