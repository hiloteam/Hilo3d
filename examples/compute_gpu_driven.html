<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
        <title>Hilo3D WebGPU Compute & GPU-Driven Rendering</title>
        <link rel="stylesheet" type="text/css" href="./example.css" />
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #090d16;
                color: #e9f2ff;
                font-family: system-ui, sans-serif;
            }

            #container {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
            }

            canvas {
                width: min(96vw, 1152px) !important;
                height: auto !important;
                image-rendering: auto;
                border: 1px solid #35445e;
                box-shadow: 0 18px 70px rgb(0 0 0 / 45%);
            }

            #legend {
                position: fixed;
                inset: 18px 18px auto;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
                pointer-events: none;
            }

            #legend section {
                padding: 10px 12px;
                border: 1px solid rgb(133 167 219 / 24%);
                border-radius: 8px;
                background: rgb(7 12 22 / 78%);
                backdrop-filter: blur(8px);
            }

            #legend strong,
            #legend small {
                display: block;
            }

            #legend small {
                margin-top: 4px;
                color: #a9bad2;
            }
        </style>
    </head>
    <body>
        <div id="container"></div>
        <div id="legend" aria-label="GPU-driven effect lanes">
            <section>
                <strong>Forward+ data flow</strong>
                <small>depth prepass → sampled-depth tile cull → fragment storage read</small>
            </section>
            <section>
                <strong>Gaussian splats</strong>
                <small>cull → reorder ×2 → indirect blended draw</small>
            </section>
            <section>
                <strong>GPU particles</strong>
                <small>Hilo3D targets → curl-noise flow → additive indirect glow</small>
            </section>
        </div>
        <script type="module" src="./compute_gpu_driven.ts"></script>
    </body>
</html>
