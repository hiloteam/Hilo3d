<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
        <title>Hilo3D Crystal Compute Path Tracer</title>
        <link rel="stylesheet" type="text/css" href="./example.css" />
        <style>
            :root {
                color-scheme: dark;
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: #02030a;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                overflow: hidden;
                background:
                    radial-gradient(circle at 30% 18%, rgb(56 64 158 / 24%), transparent 38%),
                    radial-gradient(circle at 75% 75%, rgb(9 108 154 / 18%), transparent 34%),
                    #02030a;
                color: #e9f7ff;
            }

            body::before {
                position: fixed;
                inset: 0;
                background-image: linear-gradient(rgb(255 255 255 / 1.3%) 1px, transparent 1px);
                background-size: 100% 4px;
                content: '';
                pointer-events: none;
                opacity: 0.16;
            }

            #container {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                padding: clamp(0px, 2.6vw, 34px);
            }

            canvas {
                width: min(96vw, 1440px) !important;
                height: auto !important;
                max-height: 94vh;
                border: 1px solid rgb(155 211 255 / 28%);
                border-radius: 15px;
                box-shadow:
                    0 0 0 1px rgb(142 102 255 / 12%),
                    0 0 100px rgb(72 90 255 / 15%),
                    0 36px 120px rgb(0 0 0 / 78%);
                cursor: grab;
                touch-action: none;
            }

            canvas:active {
                cursor: grabbing;
            }

            #hud {
                position: fixed;
                inset: clamp(18px, 3vw, 42px);
                z-index: 2;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                pointer-events: none;
                text-transform: uppercase;
                letter-spacing: 0.13em;
                text-shadow: 0 0 20px rgb(85 198 255 / 44%);
            }

            .topline,
            .bottomline {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 24px;
            }

            .brand {
                display: grid;
                gap: 5px;
            }

            .brand strong {
                font-size: clamp(18px, 2vw, 30px);
                font-weight: 760;
                letter-spacing: 0.24em;
                background: linear-gradient(90deg, #d8fcff, #71cfff 44%, #c3a1ff);
                background-clip: text;
                color: transparent;
            }

            .brand small,
            .render-state,
            .controls,
            .signature {
                color: rgb(178 215 232 / 68%);
                font-size: 9px;
                line-height: 1.8;
            }

            .render-state {
                display: grid;
                min-width: 175px;
                padding: 9px 12px;
                border: 1px solid rgb(127 205 255 / 22%);
                border-radius: 9px;
                background: rgb(4 9 20 / 52%);
                backdrop-filter: blur(12px);
                text-align: right;
            }

            .render-state b {
                color: #9effda;
                font-size: 10px;
                font-weight: 650;
            }

            .render-state b::before {
                display: inline-block;
                width: 6px;
                height: 6px;
                margin-right: 7px;
                border-radius: 50%;
                background: currentColor;
                box-shadow: 0 0 12px currentColor;
                content: '';
            }

            .controls {
                display: flex;
                gap: 18px;
                flex-wrap: wrap;
            }

            .controls b {
                color: #e7f9ff;
                font-weight: 650;
            }

            .signature {
                max-width: 390px;
                color: rgb(185 164 255 / 72%);
                text-align: right;
            }

            @media (max-width: 720px) {
                #container {
                    padding: 0;
                }

                canvas {
                    width: 100vw !important;
                    border: 0;
                    border-radius: 0;
                }

                #hud {
                    inset: 14px;
                }

                .render-state span,
                .signature {
                    display: none;
                }

                .render-state {
                    min-width: auto;
                    padding: 7px 9px;
                }

                .controls {
                    gap: 9px 14px;
                }
            }
        </style>
    </head>
    <body>
        <div id="container"></div>
        <div id="hud" aria-label="Hilo3D compute path tracing controls">
            <div class="topline">
                <div class="brand">
                    <strong>Hilo3D</strong>
                    <small>Crystal compute path tracer / WebGPU</small>
                </div>
                <div class="render-state">
                    <b>Denoised progressive</b>
                    <strong id="sample-count" aria-live="polite">000 spp</strong>
                    <span>5 bounces · edge-aware filter · stable bind groups</span>
                </div>
            </div>
            <div class="bottomline">
                <div class="controls">
                    <span><b>Drag</b> orbit camera</span>
                    <span><b>Wheel</b> dolly</span>
                    <span><b>Double click</b> reset view</span>
                </div>
                <div class="signature">
                    Spectral caustics / volumetric sun shafts / sunset water / ACES bloom
                </div>
            </div>
        </div>
        <script type="module" src="./compute_raytracing.ts"></script>
    </body>
</html>
