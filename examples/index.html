<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Hilo3D ECS examples</title>
        <style>
            :root {
                color-scheme: dark;
                font: 16px/1.5 system-ui;
                background: #090d18;
                color: #e9efff;
            }
            body {
                max-width: 920px;
                margin: 0 auto;
                padding: 48px 24px;
            }
            h1 {
                font-size: clamp(2rem, 6vw, 4rem);
                margin-bottom: 8px;
            }
            p {
                color: #9cabc9;
            }
            section {
                margin-top: 40px;
                display: grid;
                gap: 12px;
            }
            section h2 {
                margin: 0;
            }
            a {
                display: grid;
                gap: 4px;
                padding: 18px;
                color: inherit;
                text-decoration: none;
                border: 1px solid #263656;
                border-radius: 12px;
                background: #10182a;
            }
            a:hover {
                border-color: #5dd8ff;
            }
            a span {
                color: #9cabc9;
            }
        </style>
    </head>
    <body>
        <h1>Hilo3D ECS</h1>
        <p>Engine owns presentation. World owns entities, components, systems, and resources.</p>
        <main id="catalog"></main>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
