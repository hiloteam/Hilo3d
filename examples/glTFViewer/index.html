<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>glTF Viewer - rendered by Hilo3d</title>
    <link rel='stylesheet' href='./css/index.css'>
</head>
<body>
    <script type="module" src="./js/prelude.ts"></script>
    <input type='file' multiple id='input'>
    <div id='inputContainer'>
        <div class='title'>It's a glTF Viewer rendered by <a href='https://github.com/hiloteam/Hilo3d'>Hilo3d</a>.</div>
        <div class='dropArea'>
            <div class='info'>Drag glTF 2.0 files or folder here</div>
            <div class='iconfont' id='uploadIcon'>&#xe639;</div>
        </div>
        <div class='linkInputArea'>
            <input id='linkInput' type='text' placeholder='Copy the glTF model url here!'>
            <button id='showLinkBtn'>show the model</button>
        </div>
    </div>
    <div id='stageContainer'></div>
    <!-- @vite-ignore: third-party classic script copied by vite.examples.config.ts -->
    <script src='./lib/simple-dropzone.vendor.min.js'></script>
    <script type="module" src='../js/hilo3d.ts'></script>
    <!-- @vite-ignore: Emscripten decoder exposes a classic-script global -->
    <script src="../../examples/loader/draco/draco_decoder.vendor.js"></script>
    <script type="module" src="../../examples/loader/draco/DracoLoader.ts"></script>
    <script type="module" src='../../examples/js/init.ts'></script>
    <script type="module" src='../../examples/js/stats.ts'></script>
    <script type="module" src='../../examples/js/OrbitControls.ts'></script>
    <script type="module" src='./js/index.ts'></script>
</body>
</html>
